name: qr_attendance_app
description: Simple QR attendance app for predefined shop employees.
publish_to: "none"
version: 0.1.3+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  mobile_scanner: ^7.4.0
  network_info_plus: ^7.0.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/icon/jf_attendance_launcher.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
